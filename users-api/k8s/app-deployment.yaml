apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-crud-deployment
spec:
  selector:
    matchLabels:
      app: springboot-k8s-mysql
  replicas: 3
  template:
    metadata:
      labels:
        app: springboot-k8s-mysql
    spec:
      initContainers:
      - name: wait-for-mysql
        image: 	  busybox:1.35
        command: 
        - /bin/sh
        - -c
        - |
          until nc -z mysql 3306; do
            echo "Waiting for MySQL to be ready..."
            sleep 5
            done
            echo "MySQL is ready!"

      containers:
        - name: springboot-crud-k8s
          image: spring-users-api-k8s:1.0
          ports:
            - containerPort: 8080
          env:   # Setting Enviornmental Variables
            - name: SPRING_PROFILES_ACTIVE
              value: dev
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/mysqldbUSERS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "myapp"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "myapp123"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "com.mysql.cj.jdbc.Driver"
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "none"
            - name: SPRING_FLYWAY_ENABLED
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "1"
              
            #- name: DB_HOST
            #  value: mysql
              #value: mysql:3306/mysqldbUSERS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval
            #- name: DB_NAME
            #  value: mysqldbUSERS
            #- name: DB_USER
            #  value: myapp
            #- name: DB_PASS
            #  value: myapp123

---

apiVersion: v1 # Kubernetes API version
kind: Service # Kubernetes resource kind we are creating
metadata: # Metadata of the resource kind we are creating
  name: springboot-crud-svc
spec:
  selector:
    app: springboot-k8s-mysql
  ports:
    - protocol: "TCP"
      port: 8080 # The port that the service is running on in the cluster
      targetPort: 8080 # The port exposed by the service
  type: NodePort # type of the service.