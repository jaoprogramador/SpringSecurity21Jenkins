spring:
  application:
    name: myapp

  datasource:
    url: jdbc:mysql://localhost:3305/mysqldbUSERS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    #url: jdbc:mysql://${DB_HOST}/${DB_NAME}?useSSL=false
    username: myapp
    password: myapp123
    #username: ${DB_USER}
    #password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update  # Flyway gestiona los cambios
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    generate-ddl: true

  sql:
    init:
      mode: never

  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false          
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  level:
    root: INFO
    org:
      springframework: INFO
  file:
    name: logs/app.log