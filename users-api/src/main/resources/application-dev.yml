spring:
  application:
    name: myapp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mysqldbUSERS?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    #url: jdbc:mysql://${DB_HOST}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: myapp
    password: myapp123
    #username: ${DB_USER}
    #password: ${DB_PASS}
    hikari:
      connection-timeout: 60000 
      initialization-fail-timeout: 0
    

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    #database-platform: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1  # ✅ Añadir versión baseline
    clean-disabled: true
    validate-migration-naming: true
         
management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
logging:
  level:
    root: INFO
    org:
      springframework: INFO
  file:
    name: logs/app.log
